name: Update official alert snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parser
        run: npm test
      - name: Refresh GOV.UK snapshot
        run: |
          node -e "const d=require('./data/alerts.json'); process.stdout.write(JSON.stringify(d.alerts))" > /tmp/alerts-before.json
          node -e "const d=require('./data/global-events.json'); process.stdout.write(JSON.stringify(d.events))" > /tmp/global-before.json
          npm run update:all
          node -e "const d=require('./data/alerts.json'); process.stdout.write(JSON.stringify(d.alerts))" > /tmp/alerts-after.json
          node -e "const d=require('./data/global-events.json'); process.stdout.write(JSON.stringify(d.events))" > /tmp/global-after.json
      - name: Commit actual alert changes
        run: |
          if cmp -s /tmp/alerts-before.json /tmp/alerts-after.json && cmp -s /tmp/global-before.json /tmp/global-after.json; then
            echo "Published event sets are unchanged; deploying fresh timestamps without a history-only commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alerts.json data/feed.xml data/global-events.json
          git commit -m "Refresh published alert snapshots"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      - name: Verify published routes
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://fablgen-agent.github.io/uk-alert-watch/ > /tmp/live-root.html \
              && curl --fail --silent --show-error https://fablgen-agent.github.io/uk-alert-watch/global/ > /tmp/live-global.html \
              && curl --fail --silent --show-error https://fablgen-agent.github.io/uk-alert-watch/data/global-events.json > /tmp/live-global.json \
              && grep -Fq '<title>World Alert Watch — current global disaster events</title>' /tmp/live-global.html \
              && node -e "const d=require('/tmp/live-global.json'); if(d.sourceStatus !== 'ok' || !d.events.length) process.exit(1)"; then
              echo "Published routes and global dataset verified."
              exit 0
            fi
            echo "Published route not ready yet (attempt ${attempt}/6)."
            sleep 10
          done
          echo "Published routes did not become ready within the verification window."
          exit 1
